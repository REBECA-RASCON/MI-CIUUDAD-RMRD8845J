<!DOCTYPE html> <!-- documento es un archivo HTML5 -->
<html lang="es"> <!-- Inicio del documento HTML -->
<head>
	<meta charset="UTF-8"> <!-- Permite usar caracteres especiales-->
	<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Hace que la página sea adaptable a celulares -->
	<title>CONTACTO - CD. JUÁREZ</title> <!-- Título que aparece en la pestaña -->
	<style>
		body {
			font-family: 'Times New Roman', serif; /* Cambia la tipografía a Times New Roman */
			margin: 0; /* Quita el margen por defecto de la página */
			text-align: center; /* Centra el texto por defecto */
		}

		header {
			padding: 15px; /* Espacio interior arriba y abajo del encabezado */
		}

		main {
			max-width: 500px; /* Ancho máximo del contenido principal */
			margin: 0 auto; /* Centra horizontalmente la sección principal */
			padding: 20px; /* Espacio interno alrededor del formulario */
			text-align: left; /* Alinea los textos del formulario a la izquierda */
		}

		h2 {
			text-align: center; /* Centra el título de la sección de contacto */
		}

		label {
			display: block; /* Hace que el texto del campo ocupe su propia línea */
			margin-top: 15px; /* Separa cada etiqueta del campo anterior */
			font-weight: bold; /* Pone el texto de las etiquetas en negrita */
		}

		input, select, textarea {
			width: 100%; /* Hace que los campos abarquen todo el ancho disponible */
			padding: 6px; /* Relleno interno para que los campos se vean más amplios */
			font-family: inherit; /* Utiliza la misma tipografía del cuerpo */
			font-size: 1rem; /* Define el tamaño de letra dentro de los campos */
		}

		button {
			margin-top: 20px; /* Separación con respecto al campo anterior */
			width: 100%; /* El botón ocupa todo el ancho del formulario */
			padding: 10px; /* Altura y grosor del botón */
			background-color: #1a2a3a; /* Color de fondo azul oscuro para el botón */
			color: white; /* Texto del botón en color blanco */
			border: none; /* Quita el borde predeterminado del botón */
			font-family: inherit; /* Hereda la tipografía Times New Roman */
			font-size: 1rem; /* Tamaño de letra del botón */
		}

		footer {
			background-color: #0b131c; /* Fondo azul muy oscuro para el pie de página */
			color: white; /* Texto en blanco dentro del footer */
			padding: 15px; /* Relleno para darle altura al footer */
		}

		footer a {
			color: white; /* Hace que el enlace dentro del footer sea blanco */
		}
	</style>
</head>
<body>

	<header>
		<h1>MI CIUDAD</h1> <!-- Título principal del sitio -->
		<h3>CD. JUÁREZ</h3> <!-- Subtítulo con el nombre de la ciudad -->
	</header>

	<main>
		<h2>CONTÁCTANOS</h2> <!-- Encabezado de la sección del formulario -->

		<form action="#" method="post"> <!-- Inicio del formulario de contacto -->
			<label for="nombre">Nombre:</label> <!-- Etiqueta para el nombre -->
			<input type="text" id="nombre" required> <!-- Campo de texto obligatorio -->

			<label for="correo">Correo electrónico:</label> <!-- Etiqueta para el correo -->
			<input type="email" id="correo" required> <!-- Campo para e-mail obligatorio -->

			<label for="tema">Tema de tu duda:</label> <!-- Etiqueta del menú desplegable -->
			<select id="tema"> <!-- Inicio de la lista de opciones -->
				<option>Lugares importantes</option> <!-- Opción 1 -->
				<option>Gastronomía</option> <!-- Opción 2 -->
				<option>Danzas</option> <!-- Opción 3 -->
				<option>Historia</option> <!-- Opción 4 -->
				<option>Otro</option> <!-- Opción 5 -->
			</select> <!-- Cierre del menú de opciones -->

			<label for="mensaje">¿Cuál es tu duda?</label> <!-- Etiqueta para el mensaje -->
			<textarea id="mensaje" rows="5" required></textarea> <!-- Cuadro de texto amplio y obligatorio -->

			<button type="submit">Enviar</button> <!-- Botón para enviar la información -->
		</form> <!-- Cierre del formulario -->
	</main>

	<footer>
		<a href="index.html">&larr; Volver al inicio</a> <!-- Enlace para regresar a la página principal -->
	</footer>

</body>
</html>
