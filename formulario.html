<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CONTACTO - CD. JUÁREZ</title>
	<style>
		body {
			font-family: 'Times New Roman', serif;
			margin: 0;
			text-align: center;
		}
 
		header {
			padding: 15px;
		}
 
		main {
			max-width: 500px;
			margin: 0 auto;
			padding: 20px;
			text-align: left;
		}
 
		h2 {
			text-align: center;
		}
 
		label {
			display: block;
			margin-top: 15px;
			font-weight: bold;
		}
 
		input, select, textarea {
			width: 100%;
			padding: 6px;
			font-family: inherit;
			font-size: 1rem;
		}
 
		button {
			margin-top: 20px;
			width: 100%;
			padding: 10px;
			background-color: #1a2a3a;
			color: white;
			border: none;
			font-family: inherit;
			font-size: 1rem;
		}
 
		footer {
			background-color: #0b131c;
			color: white;
			padding: 15px;
		}
 
		footer a {
			color: white;
		}
	</style>
</head>
<body>
 
	<header>
		<h1>MI CIUDAD</h1>
		<h3>CD. JUÁREZ</h3>
	</header>
 
	<main>
		<h2>CONTÁCTANOS</h2>
 
		<form action="#" method="post">
			<label for="nombre">Nombre:</label>
			<input type="text" id="nombre" required>
 
			<label for="correo">Correo electrónico:</label>
			<input type="email" id="correo" required>
 
			<label for="tema">Tema de tu duda:</label>
			<select id="tema">
				<option>Lugares importantes</option>
				<option>Gastronomía</option>
				<option>Danzas</option>
				<option>Historia</option>
				<option>Otro</option>
			</select>
 
			<label for="mensaje">¿Cuál es tu duda?</label>
			<textarea id="mensaje" rows="5" required></textarea>
 
			<button type="submit">Enviar</button>
		</form>
	</main>
 
	<footer>
		<a href="index.html">&larr; Volver al inicio</a>
	</footer>
 
</body>
</html>
